<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="50%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
    <filter id="playGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#posterBg)"/>

  <!-- Speed Stripes & Accents -->
  <path d="M0 0 L320 0 L180 720 L0 720 Z" fill="#e10600" fill-opacity="0.04"/>
  <path d="M1280 0 L1100 0 L960 720 L1280 720 Z" fill="#00f0ff" fill-opacity="0.03"/>

  <!-- Top bar -->
  <rect x="60" y="40" width="1160" height="56" rx="12" fill="#151b27" fill-opacity="0.8" stroke="#252f44" stroke-width="1.5"/>
  <rect x="80" y="54" width="36" height="28" rx="6" fill="#e10600"/>
  <text x="98" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">F1</text>
  <text x="126" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#ffffff">PADDOCK <tspan fill="#e10600">AI</tspan></text>
  
  <rect x="1040" y="52" width="160" height="32" rx="16" fill="#00e676" fill-opacity="0.15" stroke="#00e676"/>
  <circle cx="1060" cy="68" r="4" fill="#00e676"/>
  <text x="1125" y="73" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#00ff88" text-anchor="middle">DEMO EM VÍDEO</text>

  <!-- Center Play Button & Title -->
  <g transform="translate(640, 360)">
    <!-- Outer pulse rings -->
    <circle cx="0" cy="-30" r="76" fill="none" stroke="#e10600" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8,6"/>
    <circle cx="0" cy="-30" r="62" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="-30" r="50" fill="url(#playGrad)" filter="url(#playGlow)"/>
    
    <!-- Triangle Play Icon -->
    <polygon points="-8,-45 16,-30 -8,-15" fill="#ffffff"/>

    <!-- Title below play button -->
    <text x="0" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      VÍDEO DE DEMONSTRAÇÃO // F1 PADDOCK INSIGHTS
    </text>
    <text x="0" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#00f0ff" text-anchor="middle">
      APLICAÇÃO MOBILE-FIRST • TELEMETRIA DE CAMPEÃO • RÁDIO PIT WALL COM GEMINI
    </text>
    <text x="0" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8c97b2" text-anchor="middle">
      Clique no player para reproduzir o vídeo ou navegar pelos capítulos interativos
    </text>
  </g>

  <!-- Bottom Badges Row -->
  <g transform="translate(640, 650)">
    <rect x="-350" y="-20" width="700" height="40" rx="20" fill="#141a27" stroke="#253046" stroke-width="1"/>
    <text x="-260" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">📡 OpenF1 REST API</text>
    <text x="-70" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">🌐 Web Scraping Grande Prêmio</text>
    <text x="150" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">🧠 Google Gemini AI</text>
  </g>
</svg>