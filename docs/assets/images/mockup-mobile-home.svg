<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="homeCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0e121a"/>
    </linearGradient>
    <linearGradient id="redAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="100%" stop-color="#e10600"/>
    </linearGradient>
    <linearGradient id="cyanKeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
  </defs>

  <!-- Mobile Outer Shell -->
  <rect width="420" height="860" rx="36" fill="#090b10" stroke="#262e40" stroke-width="3"/>

  <!-- Notch & Status Bar -->
  <rect x="135" y="10" width="150" height="20" rx="10" fill="#141722"/>
  <circle cx="255" cy="20" r="4" fill="#1e2436"/>
  <rect x="180" y="18" width="40" height="4" rx="2" fill="#1e2436"/>
  <text x="40" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#8c97b2">14:04</text>
  <text x="360" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8c97b2">5G 🔋</text>

  <!-- App Header -->
  <rect x="20" y="45" width="380" height="50" rx="10" fill="#12151f" stroke="#1f2535" stroke-width="1"/>
  <rect x="35" y="55" width="32" height="30" rx="6" fill="#e10600"/>
  <text x="51" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">F1</text>
  <text x="78" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">PADDOCK <tspan fill="#e10600">AI</tspan></text>
  <text x="78" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8" fill="#717d96" letter-spacing="1">TELEMETRY &amp; STRATEGY</text>

  <!-- Hero Banner -->
  <g transform="translate(20, 106)">
    <rect width="380" height="92" rx="12" fill="#111624" stroke="#212a3d" stroke-width="1"/>
    
    <rect x="15" y="10" width="220" height="18" rx="9" fill="#e10600" fill-opacity="0.15"/>
    <circle cx="25" cy="19" r="3.5" fill="#e10600"/>
    <text x="35" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" fill="#ff4d4d">FIA FORMULA ONE // PIT WALL COMMS</text>

    <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#ffffff">
      SISTEMA DE TELEMETRIA
    </text>
    <text x="15" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#e10600">
      &amp; ESTRATÉGIA COM IA
    </text>
    
    <text x="15" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#8c97b2">
      OpenF1 API • Scraping Grande Prêmio • Google Gemini
    </text>
  </g>

  <!-- Control Card / Form -->
  <g transform="translate(20, 210)">
    <rect width="380" height="625" rx="14" fill="url(#homeCardBg)" stroke="#273145" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="4" rx="2" fill="url(#redAccentLine)"/>

    <!-- Form Title -->
    <circle cx="28" cy="22" r="4" fill="#00e676"/>
    <text x="40" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#ffffff" letter-spacing="0.5">
      CONFIGURAÇÃO DE TELEMETRIA
    </text>
    <rect x="285" y="14" width="75" height="16" rx="4" fill="#182030" stroke="#2c374d"/>
    <text x="322" y="25.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#00e676" text-anchor="middle">CANAL SEGURO</text>

    <!-- Field 1: Driver Selection -->
    <g transform="translate(15, 38)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">
        🏎️ PILOTO DO GRID:
      </text>

      <!-- Input box -->
      <rect x="0" y="20" width="350" height="38" rx="8" fill="#0c0e14" stroke="#00f0ff" stroke-width="1.2"/>
      <text x="15" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ffffff">Antonelli</text>
      <line x1="72" y1="30" x2="72" y2="48" stroke="#00f0ff" stroke-width="2"/>

      <!-- Quick select pills -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="75" height="22" rx="11" fill="#182030" stroke="#253046"/>
        <text x="37.5" y="14.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a4b1cd" text-anchor="middle">Verstappen</text>

        <rect x="80" y="0" width="70" height="22" rx="11" fill="#182030" stroke="#253046"/>
        <text x="115" y="14.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a4b1cd" text-anchor="middle">Hamilton</text>

        <rect x="155" y="0" width="65" height="22" rx="11" fill="#182030" stroke="#253046"/>
        <text x="187.5" y="14.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a4b1cd" text-anchor="middle">Norris</text>

        <rect x="225" y="0" width="125" height="22" rx="11" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff"/>
        <text x="287.5" y="14.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#00f0ff" text-anchor="middle">⚡ Antonelli (Campeão)</text>
      </g>
    </g>

    <!-- Field 2: Radio Personality Cards -->
    <g transform="translate(15, 138)">
      <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">
        🎙️ PERSONALIDADE DO RÁDIO / ANÁLISE:
      </text>

      <!-- Option 1: Selected (Engenheiro) -->
      <rect x="0" y="22" width="350" height="46" rx="8" fill="#151b27" stroke="#e10600" stroke-width="1.5"/>
      <circle cx="18" cy="45" r="6" fill="#090b10" stroke="#e10600" stroke-width="2"/>
      <circle cx="18" cy="45" r="3" fill="#e10600"/>
      <text x="32" y="49" font-size="13">🔧</text>
      <text x="54" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#ffffff">Engenheiro de Pista</text>
      <text x="54" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#8c97b2">Telemetria fria, dados de pneus e conservação.</text>

      <!-- Option 2: Narrador Emocionado -->
      <rect x="0" y="74" width="350" height="42" rx="8" fill="#10141e" stroke="#212a3d"/>
      <circle cx="18" cy="95" r="6" fill="#090b10" stroke="#37435f" stroke-width="1.5"/>
      <text x="32" y="99" font-size="13">🎙️</text>
      <text x="54" y="90" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" fill="#cbd5e1">Narrador Emocionado</text>
      <text x="54" y="103" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#717d96">Adrenalina pura e emoção no rádio!</text>

      <!-- Option 3: Comentarista Corneta -->
      <rect x="0" y="122" width="350" height="42" rx="8" fill="#10141e" stroke="#212a3d"/>
      <circle cx="18" cy="143" r="6" fill="#090b10" stroke="#37435f" stroke-width="1.5"/>
      <text x="32" y="147" font-size="13">🏁</text>
      <text x="54" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" fill="#cbd5e1">Comentarista Corneta</text>
      <text x="54" y="151" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#717d96">Ironia, sarcasmo e zoeira de paddock.</text>
    </g>

    <!-- Field 3: API Key Input & Key Rotation Section (NEW!) -->
    <g transform="translate(15, 318)">
      <rect width="350" height="185" rx="8" fill="#10141e" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4"/>
      
      <!-- Label & Badge -->
      <text x="12" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#ffffff">
        🔑 CHAVE(S) DA API GOOGLE GEMINI:
      </text>
      <rect x="225" y="9" width="115" height="15" rx="3" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.7"/>
      <text x="282.5" y="19.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7" fill="#00e5ff" text-anchor="middle">2 CHAVES NO POOL</text>

      <!-- Input box with masked keys & eye button -->
      <rect x="12" y="30" width="326" height="36" rx="6" fill="#08090d" stroke="#2e384e"/>
      <text x="24" y="52" font-family="monospace" font-size="10" fill="#00ff88">AIzaSyDLM••••••, AIzaSyBK9••••••</text>
      
      <!-- Eye Toggle Button -->
      <rect x="305" y="36" width="26" height="24" rx="4" fill="#161c28"/>
      <text x="318" y="52" font-size="11" text-anchor="middle">👁️</text>

      <!-- Status Bar with pulsing cyan LED -->
      <g transform="translate(12, 75)">
        <circle cx="8" cy="8" r="4" fill="#00e5ff"/>
        <text x="18" y="11" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#8c97b2">
          2 chaves prontas para rodízio automático
        </text>
        <rect x="215" y="0" width="110" height="16" rx="4" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
        <text x="270" y="11.5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" fill="#00e5ff" text-anchor="middle">🔄 RODÍZIO ATIVO (2X)</text>
      </g>

      <!-- Helper note box -->
      <rect x="12" y="100" width="326" height="72" rx="6" fill="#080a0f" stroke="#e10600" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="22" y="116" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#ffffff">
        💡 Rodízio Inteligente de Chaves (Round-Robin &amp; Fallback):
      </text>
      <text x="22" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#8c97b2">
        • Insira múltiplas chaves separadas por vírgula (<code>,</code>).
      </text>
      <text x="22" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#8c97b2">
        • Distribui chamadas e faz fallback automático se a cota esgotar.
      </text>
      <text x="22" y="156" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" font-style="italic" fill="#00ff88">
        ✓ 100% no navegador (localStorage). Sem necessidade de arquivo .env!
      </text>
    </g>

    <!-- Submit Button & F1 Lights -->
    <g transform="translate(15, 520)">
      <rect width="350" height="44" rx="10" fill="#e10600"/>
      <text x="175" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        INICIAR TELEMETRIA &amp; ESTRATÉGIA ⚡
      </text>

      <!-- 5 F1 Lights -->
      <g transform="translate(115, 52)">
        <circle cx="10" cy="0" r="4" fill="#e10600"/>
        <circle cx="35" cy="0" r="4" fill="#e10600"/>
        <circle cx="60" cy="0" r="4" fill="#e10600"/>
        <circle cx="85" cy="0" r="4" fill="#e10600"/>
        <circle cx="110" cy="0" r="4" fill="#e10600"/>
      </g>
    </g>
  </g>
</svg>
