  <circle cx="55" cy="47.5" r="5" fill="#ff4d4d"/>
  <circle cx="72" cy="47.5" r="5" fill="#ffcc00"/>
  <circle cx="89" cy="47.5" r="5" fill="#00e676"/>
  <text x="115" y="53" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#ffffff" letter-spacing="1">ARQUITETURA DE WEB SERVICES // F1 PADDOCK INSIGHTS</text>
  <rect x="740" y="35" width="175" height="25" rx="4" fill="#e10600" fill-opacity="0.15" stroke="#e10600" stroke-width="1"/>
  <text x="827" y="51" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#ff4d4d" text-anchor="middle">SISTEMA INTEGRADO</text>

  <!-- CLIENT NODE (LEFT) -->
  <g transform="translate(40, 110)">
    <rect width="210" height="380" rx="12" fill="url(#cardGrad)" stroke="#2b3347" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="6" rx="3" fill="url(#cyanAccent)"/>
    
    <text x="105" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#00f0ff" text-anchor="middle">CLIENTE MOBILE-FIRST</text>
    <text x="105" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#8c97b2" text-anchor="middle">Interface Responsiva (Browser)</text>
    
    <!-- Phone graphic -->
    <rect x="30" y="75" width="150" height="275" rx="16" fill="#0c0e14" stroke="#3d4760" stroke-width="2"/>
    <rect x="65" y="85" width="80" height="5" rx="2.5" fill="#2a3042"/>
    
    <!-- Mini UI inside phone -->
    <rect x="42" y="100" width="126" height="18" rx="4" fill="#e10600"/>
    <text x="105" y="113" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#ffffff" text-anchor="middle">F1 PADDOCK AI</text>
    
    <rect x="42" y="122" width="126" height="20" rx="4" fill="#181d2a" stroke="#2c3449"/>
    <text x="50" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#6d7996">🏎️ Piloto: Antonelli</text>
    
    <rect x="42" y="146" width="126" height="20" rx="4" fill="#181d2a" stroke="#2c3449"/>
    <text x="50" y="160" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#6d7996">🎙️ Tom: Engenheiro</text>
    
    <rect x="42" y="170" width="126" height="22" rx="4" fill="#181d2a" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="50" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" fill="#00e5ff">🔑 Chaves: [K1, K2...]</text>

    <rect x="42" y="196" width="126" height="22" rx="4" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff"/>
    <text x="105" y="211" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" fill="#00f0ff" text-anchor="middle">POST /dados (Keys)</text>
    
    <!-- Mini Gauge display -->
    <circle cx="105" cy="270" r="32" fill="none" stroke="#222838" stroke-width="6"/>
    <circle cx="105" cy="270" r="32" fill="none" stroke="#00ff88" stroke-width="6" stroke-dasharray="201" stroke-dashoffset="0"/>
    <text x="105" y="268" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">100%</text>
    <text x="105" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7" fill="#00ff88" text-anchor="middle">CAMPEÃO</text>
  </g>

  <!-- FLASK BACKEND NODE (CENTER) -->
  <g transform="translate(320, 110)">
    <rect width="250" height="380" rx="12" fill="url(#cardGrad)" stroke="#38435f" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="6" rx="3" fill="url(#redAccent)"/>
    
    <rect x="85" y="25" width="80" height="24" rx="12" fill="#e10600" fill-opacity="0.2" stroke="#e10600"/>
    <text x="125" y="41" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#ff4d4d" text-anchor="middle">BACK-END</text>
    
    <text x="125" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">FLASK ORCHESTRATOR</text>
    <text x="125" y="88" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#8c97b2" text-anchor="middle">paddock.py // Python 3.14</text>
    
    <!-- Components inside Flask -->
    <rect x="20" y="105" width="210" height="52" rx="8" fill="#131722" stroke="#273044"/>
    <text x="32" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#00f0ff">1. Router &amp; Controller</text>
    <text x="32" y="143" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a4b1cd">GET / • POST /dados • GET /classificacao</text>
    
    <rect x="20" y="168" width="210" height="58" rx="8" fill="#131722" stroke="#273044"/>
    <text x="32" y="188" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#ffd700">2. Motor de Telemetria</text>
    <text x="32" y="204" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a4b1cd">calcular_indicadores_telemetria()</text>
    <text x="32" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#00ff88">Campeonato Encerrado: #1 = 100% | Outros = 0%</text>

    <rect x="20" y="238" width="210" height="52" rx="8" fill="#131722" stroke="#273044"/>
    <text x="32" y="256" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" fill="#00e5ff">3. Rodízio de Chaves &amp; Fallback</text>
    <text x="32" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a4b1cd">Pool dinâmico de API Keys do input</text>
    <text x="32" y="284" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8.5" fill="#00ff88">Zero dependência de .env (100% seguro)</text>
    
    <rect x="20" y="302" width="210" height="56" rx="8" fill="#131722" stroke="#273044"/>
    <text x="32" y="322" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#c084fc">4. Renderização Jinja2</text>
    <text x="32" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a4b1cd">Gera HTML dinâmico com Markdown AI</text>
  </g>

