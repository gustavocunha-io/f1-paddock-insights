  <!-- Service 1: OpenF1 API -->
  <g transform="translate(640, 105)">
    <rect width="280" height="110" rx="10" fill="url(#cardGrad)" stroke="#2b3347" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="url(#cyanAccent)"/>
    <circle cx="28" cy="28" r="14" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="28" y="33" font-size="14" text-anchor="middle">📡</text>
    
    <text x="50" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">OPENF1 REST API</text>
    <rect x="185" y="14" width="80" height="18" rx="4" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="225" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#00f0ff" text-anchor="middle">API PÚBLICA</text>
    
    <text x="50" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c97b2">api.openf1.org/v1/drivers</text>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Dados oficiais dos pilotos e escuderias</text>
    <text x="20" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Fotos oficiais, número do carro e hex da equipe</text>
    <text x="20" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#00f0ff">Payload JSON Estruturado</text>
  </g>

  <!-- Service 2: BeautifulSoup Scraping -->
  <g transform="translate(640, 240)">
    <rect width="280" height="115" rx="10" fill="url(#cardGrad)" stroke="#2b3347" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="115" rx="3" fill="url(#goldAccent)"/>
    <circle cx="28" cy="28" r="14" fill="#ffd700" fill-opacity="0.15"/>
    <text x="28" y="33" font-size="14" text-anchor="middle">🌐</text>
    
    <text x="50" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">BEAUTIFULSOUP SCRAPING</text>
    <rect x="185" y="14" width="80" height="18" rx="4" fill="#ffd700" fill-opacity="0.15"/>
    <text x="225" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#ffd700" text-anchor="middle">GRANDE PRÊMIO</text>
    
    <text x="50" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c97b2">grandepremio.com/br/f1/...</text>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Raspagem em tempo real de matérias do piloto</text>
    <text x="20" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Tabela geral oficial de classificação 2026</text>
    <text x="20" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#ffd700">Extração HTML via Requests + Regex</text>
  </g>

  <!-- Service 3: Google Gemini AI -->
  <g transform="translate(640, 380)">
    <rect width="280" height="110" rx="10" fill="url(#cardGrad)" stroke="#2b3347" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="url(#redAccent)"/>
    <circle cx="28" cy="28" r="14" fill="#ff4d4d" fill-opacity="0.15"/>
    <text x="28" y="33" font-size="14" text-anchor="middle">🧠</text>
    
    <text x="50" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#ffffff">GOOGLE GEMINI AI</text>
    <rect x="185" y="14" width="80" height="18" rx="4" fill="#ff4d4d" fill-opacity="0.15"/>
    <text x="225" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#ff4d4d" text-anchor="middle">LLM SERVICE</text>
    
    <text x="50" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8c97b2">SDK: google-genai (gemini-3.5-flash-lite)</text>
    <text x="20" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Alternância de chaves Round-Robin</text>
    <text x="20" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Fallback automático em cota esgotada</text>
    <text x="20" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#00e5ff">Chaves via UI • Seguro para GitHub</text>
  </g>

  <!-- CONNECTING ARROWS -->
  <!-- Client to Flask -->
  <path d="M250 250 L320 250" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="318,246 326,250 318,254" fill="#00f0ff"/>
  <rect x="255" y="235" width="60" height="16" rx="3" fill="#0c0e14" stroke="#00f0ff" stroke-width="0.8"/>
  <text x="285" y="247" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#00f0ff" text-anchor="middle">HTTP POST</text>

  <!-- Flask back to Client -->
  <path d="M320 330 L250 330" stroke="#00ff88" stroke-width="2"/>
  <polygon points="254,326 246,330 254,334" fill="#00ff88"/>
  <rect x="255" y="320" width="60" height="16" rx="3" fill="#0c0e14" stroke="#00ff88" stroke-width="0.8"/>
  <text x="285" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#00ff88" text-anchor="middle">HTML/UI</text>

  <!-- Flask to OpenF1 -->
  <path d="M570 160 L640 160" stroke="#00f0ff" stroke-width="2"/>
  <polygon points="636,156 644,160 636,164" fill="#00f0ff"/>

  <!-- Flask to Scraping -->
  <path d="M570 300 L640 300" stroke="#ffd700" stroke-width="2"/>
  <polygon points="636,296 644,300 636,304" fill="#ffd700"/>

  <!-- Flask to Gemini -->
  <path d="M570 435 L640 435" stroke="#ff4d4d" stroke-width="2"/>
  <polygon points="636,431 644,435 636,439" fill="#ff4d4d"/>

  <!-- Bottom status note -->
  <text x="480" y="522" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#717d96" text-anchor="middle">
    F1 PADDOCK INSIGHTS • TRABALHO PRÁTICO INDIVIDUAL DE WEB SERVICES • ENGENHARIA DE SOFTWARE
  </text>
</svg>